<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#e83b3b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap"
    rel="stylesheet">
  <title>TROSC</title>
  <meta name="description" content="Trosc is a student-led team from the Faculty of Computers and Information, dedicated to guiding learners through various tech tracks." />
  <!-- Social previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TROSC" />
  <meta property="og:title" content="TROSC — Each Moves Others" />
  <meta property="og:description" content="A student-led team guiding learners through tech tracks: sessions, assignments, events and more." />
  <meta property="og:url" content="https://trosc.vercel.app/" />
  <meta property="og:image" content="https://trosc.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Apply the saved theme before first paint (see src/utils/theme.ts) -->
  <script>
    (function () {
      var p = null;
      try { p = localStorage.getItem("trosc-theme"); } catch (e) {}
      var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#190a05");
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
