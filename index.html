<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#e83b3b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap"
    rel="stylesheet">
  <title>TROSC · Student-led tech tracks at Suez Canal University</title>
  <meta name="description" content="Student-led tech team at the Faculty of Computers and Information, Suez Canal University. Learning tracks with live sessions, weekly tasks and reviewed work." />
  <meta name="google-site-verification" content="w4qo211ESOm9jvpk7X4Ft9uVDdc5fR9B8EyZoHyL358" />
  <!-- Social previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TROSC" />
  <meta property="og:title" content="TROSC · Each Moves Others" />
  <meta property="og:description" content="A student-led team guiding learners through tech tracks: sessions, assignments, events and more." />
  <meta property="og:url" content="https://trosc.vercel.app/" />
  <meta property="og:image" content="https://trosc.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Server-rendered page text (api/seo.ts) for crawlers. The app replaces it
       on start; it only shows if that takes more than a second. -->
  <style>
    .prerender { max-width: 48rem; margin: 0 auto; padding: 6rem 1rem 3rem; line-height: 1.6;
      animation: prerender-show 0s 1s both; }
    @keyframes prerender-show { from { visibility: hidden; } to { visibility: visible; } }
  </style>
  <!-- Apply the saved theme before first paint (see src/utils/theme.ts) -->
  <script>
    (function () {
      var p = null;
      try { p = localStorage.getItem("trosc-theme"); } catch (e) {}
      var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#190a05");
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
